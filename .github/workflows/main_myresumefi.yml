name: Build and deploy .NET + React app to Azure Web App - myresumefi

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      # Add Node.js setup for React
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'

      # Build React app
      - name: Build React frontend
        run: |
          cd resumeapp.client
          npm install
          npm run build

      # Copy React build to .NET wwwroot
      - name: Copy React build to wwwroot
        run: |
          mkdir -p ResumeApp.Server/wwwroot
          copy-item -Path resumeapp.client/dist/* -Destination ResumeApp.Server/wwwroot/ -Recurse -Force

      # Setup .NET
      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      # Build .NET
      - name: Build with dotnet
        run: dotnet build ResumeApp.Server/ResumeApp.Server.csproj --configuration Release

      # Publish .NET
      - name: dotnet publish
        run: dotnet publish ResumeApp.Server/ResumeApp.Server.csproj -c Release -o "${{env.DOTNET_ROOT}}/myapp"

      # Upload artifact
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_9BC18B34C6084769998386CC156B9983 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_376E0294157649A7AB80999445D35742 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_5BAE51C51D3545F8924003B7BF6B9549 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'myresumefi'
          slot-name: 'Production'
          package: .
