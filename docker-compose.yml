services:
  resumeapp.server:
    image: ${DOCKER_REGISTRY-}resumeappserver
    build:
      context: .
      dockerfile: ResumeApp.Server/Dockerfile

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      Database__ApplyMigrations: "true"

      ConnectionStrings__DefaultConnection: >-
        Server=sqlserver,1433;
        Database=ResumeDb;
        User Id=sa;
        Password=${SQL_SA_PASSWORD};
        Encrypt=True;
        TrustServerCertificate=True;
        MultipleActiveResultSets=True;

      Jwt__Key: ${JWT_KEY}

      Redis__ConnectionString: redis:6379

    depends_on:
      sqlserver:
        condition: service_healthy

      redis:
        condition: service_healthy


  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD}

    ports:
      - "14330:1433"

    volumes:
      - resumeapp_sql_data:/var/opt/mssql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -C -b -o /dev/null"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s


  redis:
    image: redis:7-alpine

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10


volumes:
  resumeapp_sql_data: